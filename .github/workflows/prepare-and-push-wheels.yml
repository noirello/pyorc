name: Prepare and push wheels

on:
  workflow_call:
    inputs:
      runs-on:
        description: The runner image to use, e.g. ubuntu-latest
        type: string
        required: true
      label:
        description: Unique label used for the artifact name
        type: string
        required: true
      qemu:
        description: Register QEMU for cross-platform Linux wheels
        type: boolean
        default: false
      cibw-build:
        description: The CIBW_BUILD selector
        type: string
        required: true
      cibw-archs:
        description: The CIBW_ARCHS selector
        type: string
        default: "auto"
      cibw-enable:
        description: The CIBW_ENABLE selector (empty means default)
        type: string
        default: ""
      cibw-skip:
        description: The CIBW_SKIP selector (empty means none)
        type: string
        default: ""
      cibw-environment:
        description: The CIBW_ENVIRONMENT environment variables passed to the build
        type: string
        default: ""
      cibw-build-verbosity:
        description: The CIBW_BUILD_VERBOSITY level
        type: string
        default: "3"
      cmake-osx-architectures:
        description: CMAKE_OSX_ARCHITECTURES for the macOS build
        type: string
        default: ""

jobs:
  prepare-and-push-wheels:
    name: Prepare and push wheels (${{ inputs.label }})
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.qemu && 165 || 60 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Worker info
        shell: bash
        run: |
          echo "Worker Arch: ${ARCH}; OS: ${OS};"
        env:
          ARCH: ${{ runner.arch }}
          OS: ${{ runner.os }}

      - name: Register QEMU
        if: ${{ inputs.qemu }}
        run: docker run --privileged --rm tonistiigi/binfmt --install all

      - name: Hide Homebrew libs (macOS only)
        if: runner.os == 'macOS'
        run: |
          for f in zstd lz4 snappy protobuf; do
            if brew list --formula --versions "$f" >/dev/null 2>&1; then
              brew unlink "$f" || true
            fi
          done

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.3.1
        env:
          CIBW_BUILD_VERBOSITY: ${{ inputs.cibw-build-verbosity }}
          CIBW_BUILD: ${{ inputs.cibw-build }}
          CIBW_ARCHS: ${{ inputs.cibw-archs }}
          CIBW_ENABLE: ${{ inputs.cibw-enable }}
          CIBW_SKIP: ${{ inputs.cibw-skip }}
          CIBW_ENVIRONMENT: "CMAKE_POLICY_VERSION_MINIMUM=3.5 PYORC_OVERRIDDEN_PROTOBUF_VERSION=36.2 ${{ inputs.cibw-environment }}"
          CMAKE_OSX_ARCHITECTURES: ${{ inputs.cmake-osx-architectures }}
        with:
          package-dir: .
          output-dir: wheelhouse

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ inputs.label }}
          path: wheelhouse
