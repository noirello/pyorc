[build-system]
requires = [
    "setuptools>=61.0.0",
    "wheel>=0.30.0",
    "pybind11>2.13.0,<4.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "pyorc"
description = "Python module for reading and writing Apache ORC file format."
license = "Apache-2.0"
dynamic = ["version"]
authors = [{ name = "noirello", email = "noirello@gmail.com" }]
requires-python = '>=3.11,<4.0'
readme = "README.rst"
keywords = ["python3", "orc", "apache-orc"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "tzdata >= 2020.5; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://github.com/noirello/pyorc"
Repository = "https://github.com/noirello/pyorc.git"
Documentation = "https://pyorc.readthedocs.io"
Changelog = "https://github.com/noirello/pyorc/blob/master/CHANGELOG.rst"
